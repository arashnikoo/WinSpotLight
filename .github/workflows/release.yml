name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compute version
        id: version
        shell: pwsh
        run: |
          $versions = foreach ($t in (git tag --list "v*")) {
            $v = $null
            if ([version]::TryParse($t.TrimStart('v'), [ref]$v)) { $v }
          }
          $latest = $versions | Sort-Object | Select-Object -Last 1
          if ($latest) {
            $next = "{0}.{1}.{2}" -f $latest.Major, $latest.Minor, ($latest.Build + 1)
          } else {
            $next = "1.0.0"
          }
          "version=$next" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=v$next" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Building version $next"

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish WinSpotLight.csproj -c Release -r win-x64 --self-contained true `
            -p:Version=${{ steps.version.outputs.version }} -o publish

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc installer.iss

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: WinSpotLight ${{ steps.version.outputs.version }}
          files: dist/*.exe
          generate_release_notes: true
